<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Municipality Incident Reporting - Register</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="register-container">
    <div class="register-box">
      <h1 class="title"><span>M</span>unicipality Incident Reporting</h1>
      <h2 class="subtitle">Web-App</h2>
      <img src="logo.png" alt="App Logo" class="logo">

      <h3 class="welcome">Create Your Account</h3>
      <p class="text-muted">
        Join us to report incidents and help build a safer, more responsive community.
      </p>

      <form action="#">
        <div class="input-group"><input type="text" placeholder="Full Name" required></div>
        <div class="input-group"><input type="email" placeholder="Email Address" required></div>
        <div class="input-group"><input type="text" placeholder="Contact Number" required></div>
        <div class="input-group"><input type="text" placeholder="Barangay" required></div>

        <div class="row">
          <input type="text" placeholder="Please input your Gender" required>
          <input type="text" placeholder="Please input your Age" required>
        </div>

        <div class="input-group"><input type="password" placeholder="Create a strong password" required></div>
        <div class="input-group"><input type="password" placeholder="Re-enter your password" required></div>

        <button type="submit" class="btn-register">Sign Up</button>

        <p class="login-text">
          Already have an account? <a href="login.html">Login</a>
        </p>
      </form>
    </div>
  </div>
</body>
</html>
