<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Municipality Incident Reporting - Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h1 class="title"><span>M</span>unicipality Incident Reporting</h1>
      <h2 class="subtitle">Web-App</h2>
      <img src="logo.png" alt="App Logo" class="logo">

      <h3 class="welcome">Welcome Back!</h3>
      <p class="text-muted">Please login to continue</p>

      <form action="#">
        <label>Email or Username</label>
        <div class="input-group">
          <input type="text" placeholder="Enter your email" required>
        </div>

        <label>Password</label>
        <div class="input-group">
          <input type="password" placeholder="Enter your password" required>
        </div>

        <div class="form-options">
          <label><input type="checkbox"> Remember Me</label>
          <a href="#" class="forgot">Forgot password ?</a>
        </div>

        <button type="submit" class="btn-login">Login</button>

        <p class="register-text">
          Don’t have an account? <a href="register.html">Create Account</a>
        </p>
      </form>
    </div>
  </div>
</body>
</html>
